<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
let NAMES=[];
const PALETTE={blue:{label:'淺藍',fill:'#dcebf3'},rose:{label:'淺紅',fill:'#f5d6d6'},purple:{label:'淺紫',fill:'#e8ddf0'}};
let nameColors={};
const colorFor=name=>PALETTE[nameColors[name]]?.fill||(['Raiden','Vikki','Tony','Cindy'].includes(name)?PALETTE.rose.fill:['Selina','Selena','Victor','Harry'].includes(name)?PALETTE.purple.fill:PALETTE.blue.fill);
function applyNameColors(){document.querySelectorAll('#rows tr').forEach((row,i)=>{row.style.setProperty('--row-color',colorFor(NAMES[Number(row.dataset.personIndex)]));});}
const DUTY_TEMPLATES={"mon": {"Day time Duty": 1, "Day GA": 1, "Elective GA OT": 1, "CLN 1": 1, "Team D (pm) specialist cover": 1, "Team D (pm) OPD cover": 1, "EOGD": 1, "Team meeting": 1, "ERCP": 1, "CLN 2": 1, "EOT": 1}, "tue": {"Day time Duty": 1, "EOGD": 1, "OPD": 1, "L-block": 1, "ERCP": 1, "LA": 1, "EOT": 1}, "wed": {"Day time Duty": 1, "DS5 LA": 2, "Elective GA: liver (S)": 2, "Team D (am) specialist cover": 1, "Team D (am) OPD cover": 1, "EOGD": 1, "PR1": 1, "Additional new case clinic": 1, "FM training": 1, "Elective GA: lap chole (A)": 2, "Elective GA: lap chole (S)": 1, "Department meeting": 1, "EOT": 1}, "thu": {"Day time Duty": 1, "CLN 1": 1, "EOGD": 1, "ERCP": 1, "EUS": 1, "CLN 2": 1, "OPD": 1, "EOT": 1}, "fri-no": {"Day time Duty": 1, "CLN 1": 1, "EOGD": 1, "ERCP": 1, "CLN 2": 1, "EOT": 1, "OGD am": 1, "OGD pm": 1, "XR meeting": 1}, "fri-ga": {"Day time Duty": 1, "CLN 1": 1, "EOGD": 1, "ERCP": 1, "CLN 2": 1, "EOT": 1, "GA list": 2, "OGD pm": 1, "MS teaching": 1, "XR meeting": 1}};
const TEMPLATE_LABELS={mon:'星期一',tue:'星期二',wed:'星期三',thu:'星期四','fri-no':'星期五（no GA）','fri-ga':'星期五（GA）'};
const OPTIONAL_DUTIES=['pm WR','On leave','Post call off','If ERCP'];
let selectedTemplate='';
const normalizeDuty=s=>s.trim().replace(/\s+/g,' ').toLowerCase();
function setupTemplate(){
 const day=new Date(S.date+'T12:00:00Z').getUTCDay();
 selectedTemplate=({1:'mon',2:'tue',3:'wed',4:'thu'})[day]||'';
 const select=$('day-template');select.replaceChildren();
 if(day===5){select.add(new Option('請選星期五版本',''));for(const id of ['fri-no','fri-ga'])select.add(new Option(TEMPLATE_LABELS[id],id));}
 else if(selectedTemplate)select.add(new Option(TEMPLATE_LABELS[selectedTemplate],selectedTemplate));
 else select.add(new Option('此日期沒有提供模板',''));
 select.value=selectedTemplate;populateDutyChoices();
}
function populateDutyChoices(){
 const duties=Object.keys(DUTY_TEMPLATES[selectedTemplate]||{});
 leaveButtons.forEach(({button,field},i)=>{
  button.replaceChildren(new Option('選擇工作（加入此格）',''));
  const period=i%2;
  for(const label of [...duties,...OPTIONAL_DUTIES]){
   if((/\(am\)|\bam$/i.test(label)&&period!==0)||(/\(pm\)|^pm WR$|\bpm$/i.test(label)&&period!==1))continue;
   button.add(new Option(label,label==='On leave'?'leave':'duty:'+label));
  }
  button.add(new Option('清空','clear'));
 });
}
function coverageResult(){
 const template=DUTY_TEMPLATES[selectedTemplate];if(!template)return null;
 return Object.entries(template).map(([label,needed])=>{
  const assigned=NAMES.flatMap((name,i)=>fields[i].flatMap((el,j)=>{
   if((/\(am\)|\bam$/i.test(label)&&j!==0)||(/\(pm\)|\bpm$/i.test(label)&&j!==1))return [];
   return el.value.split('\n').some(line=>normalizeDuty(line)===normalizeDuty(label))?[name+' '+(j===0?'AM':'PM')]:[];
  }));
  return {label,needed,assigned,remaining:Math.max(0,needed-assigned.length)};
 });
}
function updateCoverage(){
 const rows=coverageResult(),box=$('duty-coverage');$('duty-checklist').replaceChildren();
 $('day-template').disabled=S.phase==='loading'||S.previewing;
 if(!rows){box.textContent=S.date&&new Date(S.date+'T12:00:00Z').getUTCDay()===5?'請先選擇星期五 GA／no GA 版本，才能核對工作。':'此日期沒有工作模板，不能確認全部分配。';return;}
 const missing=rows.filter(x=>x.remaining),total=rows.reduce((n,x)=>n+x.needed,0),left=rows.reduce((n,x)=>n+x.remaining,0);
 const saved=S.phase==='ready'&&!S.dirty&&!S.req;
 box.textContent=missing.length?'尚欠 '+left+' / '+total+' 個名額：'+missing.map(x=>x.label+(x.remaining>1?' ×'+x.remaining:'')).join('、'):(saved?'當日工作已全部分配':'當日工作已全部分配（儲存尚未確認）');
 box.style.background=missing.length?'#fff7e7':saved?'#e7f4ea':'#fff7e7';
 rows.forEach(x=>{const li=document.createElement('li');li.textContent=x.label+'：'+Math.min(x.assigned.length,x.needed)+' / '+x.needed+(x.assigned.length?' — '+x.assigned.join('、'):'（未分配）');$('duty-checklist').append(li);});
}
$('day-template').onchange=()=>{selectedTemplate=$('day-template').value;populateDutyChoices();update();};
const S={date:'',target:'',record:null,dates:[],phase:'loading',dirty:false,req:null,inflight:null,timer:null,pastEditing:false,undo:[],conflict:null,loadError:false,importing:false,backup:'',previewing:false};
let privateKey='',previewFile=null,focusSnapshot=null,loadSequence=0;
const clone=x=>JSON.parse(JSON.stringify(x));
const nowDate=()=>new Date(Date.now()+8*3600000).toISOString().slice(0,10);
const shortDate=d=>d.split('-').reverse().join('/');
const dutyTitle=d=>shortDate(d)+' duty';
const isLeave=value=>value.trim().toLowerCase()==='leave';
const fullDate=d=>new Intl.DateTimeFormat('zh-HK',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
const clock=()=>new Intl.DateTimeFormat('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Hong_Kong'}).format(new Date());
const when=t=>new Intl.DateTimeFormat('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Hong_Kong'}).format(new Date(t));
const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!d.startsWith('0000-')&&Number.isFinite(new Date(d+'T00:00:00Z').getTime())&&new Date(d+'T00:00:00Z').toISOString().slice(0,10)===d;
const requestId=()=>{const bytes=new Uint8Array(20);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');};
let leaveButtons=[],fields=[],all=[];
function renderFields(duties){
 NAMES=Object.keys(duties);$('rows').replaceChildren();leaveButtons=[];
 fields=NAMES.map((name,i)=>['上午','下午'].map((period,j)=>{
  const row=$('rows').insertRow();row.dataset.personIndex=String(i);
  if(j===0){const th=document.createElement('th');th.scope='rowgroup';th.rowSpan=2;th.className='name-cell';th.textContent=name;row.append(th);}
  const periodCell=document.createElement('th');periodCell.scope='row';periodCell.className='period-cell';periodCell.textContent=j===0?'AM':'PM';row.append(periodCell);
  const el=document.createElement('textarea');el.rows=1;el.maxLength=2000;el.placeholder='填寫安排';el.spellcheck=false;el.autocomplete='off';el.setAttribute('aria-label',name+' '+period);el.enterKeyHint='enter';
  const cell=row.insertCell();cell.append(el);const select=document.createElement('select');select.className='duty-select';select.setAttribute('aria-label',name+' '+period+' 選擇安排');select.add(new Option('選項',''));select.add(new Option('Leave','leave'));select.add(new Option('清空','clear'));select.disabled=true;select.onchange=()=>selectDuty(el,select);cell.append(select);leaveButtons.push({button:select,field:el});return el;
 }));
all=fields.flat();bindFields();setValues(duties);applyNameColors();setupTemplate();
}
function fit(el){el.style.height='56px';el.style.height=Math.max(56,el.scrollHeight+2)+'px';}
let resizeFrame;addEventListener('resize',()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>all.forEach(fit));});
function values(){return Object.fromEntries(NAMES.map((n,i)=>[n,fields[i].map(el=>el.value)]));}
function setValues(v){NAMES.forEach((n,i)=>fields[i].forEach((el,j)=>{el.value=v[n]?.[j]||'';el.dataset.custom='false';fit(el);}));}
function say(text,error=false){$('message').textContent=text;$('message').style.color=error?'#8e231b':'';}
function status(text,state='ready'){$('status').textContent=text;$('status').dataset.state=state;}
async function rpc(name,...args){

  if(!r.ok){P.conflict=true;peopleState('另一人剛修改了名單。你的草稿仍在；請載入最新名單再修改。');return;}

  if(S.record.revision===0&&!S.dirty){await load(S.date);say('名單已儲存，新日期已使用最新名單。');}
 }catch(e){peopleState('儲存尚未確認。請保留此頁，按「再試儲存」；會用同一要求確認，不會重複新增。');}
 finally{P.busy=false;$('people-save').textContent=P.req?'再試儲存':'儲存名單';peopleControls();}
};
async function closePeople(){if(P.busy||P.req)return;if(peopleDirty()&&!await ask('放棄未儲存的名單修改？','值班表及已儲存名單不會改動。','放棄修改'))return;$('people-dialog').close();}
$('people-close').onclick=closePeople;$('people-dialog').oncancel=e=>{e.preventDefault();closePeople();};
$('people-reload').onclick=async()=>{if(P.busy||P.req)return;if(peopleDirty()&&!await ask('載入最新名單？','這會放棄尚未儲存的名單草稿。舊表不變。','載入最新'))return;await loadPeople();};
privateKey=new URLSearchParams(window.location.hash.slice(1)).get('key')||'';
if(!/^[A-Za-z0-9_-]{43}$/.test(privateKey)){
 $('fatal').textContent='請用收到的完整私密連結開啟，毋須登入。';
 $('fatal').hidden=false;status('請用完整的私密連結','error');S.phase='error';update();$('load-warning').hidden=true;
}else load(nowDate());
})();
</script></body></html>
